<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Plagio - DrPlagiumDoctor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1><a href="index.html">DrPlagiumDoctor</a></h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li class="current"><a href="check.html">Verificar Plagio</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
                <li><a href="#">Registro</a></li>
            </ul>
        </nav>
    </header>

   E<main class="check-page">
    <section class="plagiarism-check">
        <h2>Verificar Plagio</h2>
        <!-- El formulario solo debe contener los inputs y el botón -->
        <form id="plagiarismCheckForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="document">Subir Documento (PDF, TXT, DOCX):</label>
                <input type="file" id="document" name="document" accept=".pdf,.txt,.docx">
            </div>
            <div class="form-group">
                <label for="text">O pegar texto directamente:</label>
                <textarea id="text" name="text" rows="10" placeholder="Pega tu texto aquí..."></textarea>
            </div>
            <button type="submit" class="submit-button">Analizar</button>
        </form>

        <!-- Estos elementos deben estar FUERA del form para evitar conflictos -->
        <div id="loadingIndicator" class="loading" style="display:none;">Analizando...</div>

        <div id="analysisResults" class="results" style="display:none;">
            <h3>Resultados del Análisis</h3>
            <p>Porcentaje de Plagio (Texto): <span id="plagiarismPercentageText"></span>%</p>
            <div id="plagiarismDetailsText"></div>
            <p>Porcentaje de Contenido IA: <span id="aiDetectionPercentage"></span>%</p>
            <p>Porcentaje Escrito por Humano: <span id="humanContentPercentage"></span>%</p>
            <div id="aiDetectionDetails"></div>
            <button id="downloadReport" class="report-button" style="display:none;">Descargar Informe</button>
        </div>
        
        <div id="analysisError" class="error-message" style="display:none;"></div>
    </section>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const plagiarismCheckForm = document.getElementById('plagiarismCheckForm');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const analysisResults = document.getElementById('analysisResults');
    const analysisError = document.getElementById('analysisError');
    const API_BASE_URL = 'http://localhost:5000';

    if (plagiarismCheckForm) {
        plagiarismCheckForm.addEventListener('submit', async (event) => {
            event.preventDefault(); // Detiene el envío tradicional
            
            loadingIndicator.style.display = 'block';
            analysisResults.style.display = 'none';
            analysisError.style.display = 'none';

            const formData = new FormData(plagiarismCheckForm);
            
            try {
                // REALIZAR LA PETICIÓN (Esto faltaba en tu código)
                const response = await fetch(`${API_BASE_URL}/analyze`, {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) throw new Error('Error al conectar con el servidor.');

                const result = await response.json();
                console.log("Data recibida:", result);

                // Acceder al nivel 'results' que vimos en tu consola
                const dataReal = result.results || result; 
                const porcentaje = dataReal.plagiarism_percentage !== undefined ? dataReal.plagiarism_percentage : '0';

                // Inyectar en el DOM[cite: 1]
                document.getElementById('plagiarismPercentageText').textContent = porcentaje > 100 ? 100 : porcentaje;

                if (dataReal.ai_analysis) {
                    document.getElementById('aiDetectionPercentage').textContent = (dataReal.ai_analysis.ai_score * 100).toFixed(2);
                    const humanPct = (dataReal.ai_analysis.human_score * 100).toFixed(2);
                    document.getElementById('humanContentPercentage').textContent = humanPct;
                   const labelDiv = document.getElementById('aiDetectionDetails');
                   labelDiv.innerHTML = `<strong>Predominio:</strong> ${dataReal.ai_analysis.label}`;
                }


                analysisResults.style.display = 'block';
            } catch (error) {
                analysisError.textContent = error.message;
                analysisError.style.display = 'block';
            } finally {
                loadingIndicator.style.display = 'none';
            }
        });
    }
});
</script>
