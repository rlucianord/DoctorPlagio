services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doctorplagio-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      CHROMA_PATH: /data/chroma_data
      CHROMA_COLLECTION: tesis_universitarias_v11
      MODEL_PATH: /app/models
    volumes:
      - .:/app
      - ./data:/data
    networks:
      - postgres_postgres-network
    restart: unless-stopped

networks:
  postgres_postgres-network:
    external: true